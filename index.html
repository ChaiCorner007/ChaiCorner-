<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Corner - Menu</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ff9900">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Chai Corner">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #ff9900;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            margin-bottom: 10px;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .menu-item img {
            width: 55px;
            height: 55px;
            border-radius: 6px;
            object-fit: cover;
            margin-right: 15px;
        }
        .item-details {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        .item-name {
            font-size: 1.1em;
            font-weight: bold;
        }
        .item-price {
            font-weight: bold;
            color: #d35400;
            margin-right: 15px;
        }
        .add-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-btn:hover {
            background-color: #219653;
        }
        .cart-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed #ddd;
        }
        .cart-total {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: right;
            color: #333;
        }
        .whatsapp-btn {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe57;
        }
        /* PWA Install Button Style */
        #install-btn {
            display: none;
            width: 100%;
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.ibb.co/6R254k0/1000072000.png" alt="Chai Corner Logo" class="logo">
        <h1>Chai Corner</h1>
        <p>Signature Global The Roselia, Sector 95A, Gurugram</p>
    </div>

    <div class="container">
        <!-- PWA Install Button -->
        <button id="install-btn">📲 Install App on Home Screen</button>

        <!-- Kadak Chai -->
        <div class="menu-item">
            <div class="item-details">
                <img src="https://i.ibb.co/6R254k0/1000072000.png" alt="कड़क चाय">
                <span class="item-name">कड़क चाय</span>
            </div>
            <span class="item-price">₹25</span>
            <button class="add-btn" onclick="addToCart('कड़क चाय', 25)">Add</button>
        </div>

        <!-- Coffee -->
        <div class="menu-item">
            <div class="item-details">
                <img src="https://i.ibb.co/6R254k0/1000072000.png" alt="Coffee">
                <span class="item-name">Coffee</span>
            </div>
            <span class="item-price">₹35</span>
            <button class="add-btn" onclick="addToCart('Coffee', 35)">Add</button>
        </div>

        <!-- Namakpare (Without Image) -->
        <div class="menu-item">
            <div class="item-details">
                <span class="item-name" style="margin-left: 70px;">Namakpare</span>
            </div>
            <span class="item-price">₹30</span>
            <button class="add-btn" onclick="addToCart('Namakpare', 30)">Add</button>
        </div>

        <!-- Jeera Biscuit (With Image & 2 Pcs) -->
        <div class="menu-item">
            <div class="item-details">
                <img src="https://i.ibb.co/6R254k0/1000072000.png" alt="Jeera Biscuit">
                <span class="item-name">Jeera Biscuit (2 Pcs)</span>
            </div>
            <span class="item-price">₹5</span>
            <button class="add-btn" onclick="addToCart('Jeera Biscuit (2 Pcs)', 5)">Add</button>
        </div>

        <!-- Cart & WhatsApp Section -->
        <div class="cart-section">
            <div class="cart-total" id="cart-total">Total: ₹0</div>
            <a href="#" id="whatsapp-link" class="whatsapp-btn" onclick="sendWhatsAppOrder(event)">Order via WhatsApp 💬</a>
        </div>

        <div class="footer">
            <p>Ready for 10th Launch! 🚀</p>
        </div>
    </div>

    <!-- Scripts for Cart and PWA -->
    <script>
        let cart = {};

        function addToCart(item, price) {
            if (cart[item]) {
                cart[item].qty += 1;
            } else {
                cart[item] = { price: price, qty: 1 };
            }
            updateCart();
        }

        function updateCart() {
            let total = 0;
            for (let item in cart) {
                total += cart[item].price * cart[item].qty;
            }
            document.getElementById('cart-total').innerText = 'Total: ₹' + total;
        }

        function sendWhatsAppOrder(event) {
            event.preventDefault();
            let message = "Hello, I want to order from Chai Corner:\n";
            let total = 0;
            let hasItems = false;

            for (let item in cart) {
                if (cart[item].qty > 0) {
                    hasItems = true;
                    let cost = cart[item].price * cart[item].qty;
                    message += `- ${item} x ${cart[item].qty} = ₹${cost}\n`;
                    total += cost;
                }
            }

            if (!hasItems) {
                alert("Please add items to your cart first!");
                return;
            }

            message += `\nTotal Bill: ₹${total}`;
            let phoneNumber = "919876543210"; // यहाँ अपना WhatsApp नंबर डाल सकती हैं
            let url = `https://wa.me/${phoneNumber}?text=` + encodeURIComponent(message);
            window.open(url, '_blank');
        }

        // PWA Script
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';

            installBtn.addEventListener('click', () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>
</html>
